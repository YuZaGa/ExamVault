<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="url(#ringGrad)" stroke-width="8" />

  <!-- Background Shield Shadow / Glow -->
  <path d="M256 96 L376 148 V272 C376 348 256 416 256 416 C256 416 136 348 136 272 V148 Z" fill="none" stroke="rgba(16, 185, 129, 0.2)" stroke-width="6" />

  <!-- Central Lightning Bolt (High-yield Revision) -->
  <path d="M276 128 L176 272 H256 L236 384 L336 240 H256 Z" fill="url(#boltGrad)" filter="url(#glow)" stroke="#0B0F19" stroke-width="4" stroke-linejoin="round" />
</svg>
